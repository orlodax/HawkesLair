{{ define "main" }}
<article class="wrap post"
  {{- with .Params.theme }} data-post-theme="{{ . }}"{{ end }}
  {{- with .Params.accent }} style="{{ printf "--accent:%s" . | safeCSS }}"{{ end }}>

  <header class="post-header">
    {{ partial "post-meta.html" . }}
    <h1 class="post-title">{{ .Title | default "Untitled" }}</h1>
  </header>

  {{ partial "post-cover.html" . }}

  <div class="prose">
    {{ .Content }}
  </div>

  {{ partial "post-footer.html" . }}
  {{ partial "comments.html" . }}
</article>
{{ end }}
