{{/* The original theme put the site identity and navigation in a dark
     column on the left. Below 62rem it collapses to a stacked header. */}}
<header class="site-sidebar">
  <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  {{- with site.Params.description }}
  <p class="site-description">{{ . }}</p>
  {{- end }}

  <nav class="site-nav" aria-label="Navigazione principale">
    {{- range site.Menus.main }}
    <a href="{{ .URL | relURL }}">{{ .Name }}</a>
    {{- end }}
  </nav>

  <button class="theme-toggle" type="button" data-theme-toggle
          aria-label="Cambia tema chiaro/scuro">Tema</button>
</header>
