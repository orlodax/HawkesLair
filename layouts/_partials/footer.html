<footer class="site-footer">
  <div class="wrap">
    {{ site.Title }} — since 2004 ·
    {{- with site.GetPage "/archive" }} <a href="{{ .RelPermalink }}">Archive</a> ·{{ end }}
    {{- with site.GetPage "/privacy" }} <a href="{{ .RelPermalink }}">Privacy</a> ·{{ end }}
    {{- with site.Home.OutputFormats.Get "rss" }} <a href="{{ .RelPermalink }}">RSS</a>{{ end }}
  </div>
</footer>

<script>
(function () {
  var root = document.documentElement;

  // ---- theme: dark is the default, the toggle opts into light ----
  var themeBtn = document.querySelector('[data-theme-toggle]');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  }

  // ---- sidebar ----
  var sideBtn = document.querySelector('[data-sidebar-toggle]');
  var sidebar = document.querySelector('.site-sidebar');
  if (sideBtn && sidebar) {
    // Read actual visibility rather than the attribute: the default comes
    // from CSS, so the attribute may legitimately be absent.
    var visible = function () { return !!sidebar.offsetParent; };
    var sync = function () { sideBtn.setAttribute('aria-expanded', visible()); };
    sync();
    window.addEventListener('resize', sync);
    sideBtn.addEventListener('click', function () {
      var next = visible() ? 'closed' : 'open';
      root.setAttribute('data-sidebar', next);
      sync();
      try { localStorage.setItem('sidebar', next); } catch (e) {}
    });
  }
})();
</script>
