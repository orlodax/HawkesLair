<footer class="site-footer">
  <div class="wrap">
    {{ site.Title }} — since 2004 ·
    {{- with site.GetPage "/archive" }} <a href="{{ .RelPermalink }}">Archive</a> ·{{ end }}
    {{- with site.GetPage "/privacy" }} <a href="{{ .RelPermalink }}">Privacy</a> ·{{ end }}
    {{- with site.Home.OutputFormats.Get "rss" }} <a href="{{ .RelPermalink }}">RSS</a>{{ end }}
  </div>
</footer>

<script>
(function () {
  var root = document.documentElement;
  var btn  = document.querySelector('[data-sidebar-toggle]');
  var body = document.getElementById('archive-body');
  if (!btn || !body) return;

  // Read real visibility rather than the attribute: the responsive default
  // comes from CSS, so the attribute is absent until the reader chooses.
  var visible = function () { return !!body.offsetParent; };
  var sync = function () { btn.setAttribute('aria-expanded', visible()); };

  sync();
  window.addEventListener('resize', sync);

  btn.addEventListener('click', function () {
    var next = visible() ? 'closed' : 'open';
    root.setAttribute('data-sidebar', next);
    sync();
    try { localStorage.setItem('sidebar', next); } catch (e) {}
  });
})();
</script>
