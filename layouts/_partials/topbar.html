{{/* Title sits top-left, spanning the full width above both columns. */}}
<header class="topbar">
  <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>

  <div class="topbar-controls">
    <button class="bar-btn" type="button" data-sidebar-toggle
            aria-expanded="true" aria-controls="archive-nav">
      <span aria-hidden="true">☰</span> Archive
    </button>
    <button class="bar-btn" type="button" data-theme-toggle
            aria-label="Switch between light and dark">
      <span aria-hidden="true">◐</span> Theme
    </button>
  </div>
</header>
