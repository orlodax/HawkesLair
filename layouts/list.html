{{ define "main" }}
<div class="wrap">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    <p class="entry-excerpt">{{ len .Pages }} post</p>
  </header>

  {{- $paged := .Paginate .Pages -}}
  <div class="timeline">
    {{- range $paged.Pages }}
      {{ partial "entry.html" . }}
    {{- end }}
  </div>
  {{ partial "pager.html" $paged }}
</div>
{{ end }}
