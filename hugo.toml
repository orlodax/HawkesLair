# Production. `hugo` builds with --environment production by default.
# `hugo server` defaults to the development environment, which overrides this
# with a root baseURL in config/development/hugo.toml — otherwise every asset
# and link would carry the /hawkeslair/ prefix while the dev server serves
# from the root, and the whole site renders unstyled with 404 links.
baseURL = "https://orlodax.github.io/HawkesLair/"
title = "Hawke's Lair"
# The blog is genuinely bilingual: the 2004-2015 archive is Italian, recent
# posts are English. Neither is "the" site language. This is only a fallback
# for list pages and feed metadata — individual posts declare their own via
# the `postLang` front matter key, which drives <html lang>.
locale = "en"
defaultContentLanguage = "en"
timeZone = "Europe/Rome"
enableEmoji = true

# Imported posts keep their original numeric/Blogger slugs as aliases,
# so nothing that ever worked stops working.
disableKinds = []

[pagination]
  pagerSize = 30

[permalinks]
  posts = "/:year/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    # Required: 22 years of imported content contains raw HTML
    # (YouTube iframes, a couple of tables). Content is ours, so this is safe.
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  description = "Appunti, racconti e cose buffe. Dal 2004."
  dateFormat = "2 Jan 2006"
  # Posts shorter than this render in full on the index instead of as a link.
  inlineThreshold = 600

  [params.giscus]
    enable = false          # flip to true after enabling Discussions on the repo
    repo = "orlodax/HawkesLair"
    repoId = ""             # from https://giscus.app
    category = "Comments"
    categoryId = ""
    mapping = "pathname"
    reactionsEnabled = "1"
    lang = "it"

# No nav menu: the sidebar is the archive, and the footer carries the rest.
# Categories were dropped from navigation — they describe the legacy
# WordPress taxonomy and are not a useful way into this archive.

[outputs]
  home = ["HTML", "RSS"]

[services.rss]
  limit = 50
